[build]
  command = "npm --prefix ../lalgeo-mcp ci && npm --prefix ../lalgeo-mcp run build && npm run build"

[functions]
  included_files = [
    "node_modules/@hono/node-server/dist/**",
    "node_modules/@modelcontextprotocol/sdk/dist/cjs/**",
    "node_modules/hono/dist/cjs/**",
    "node_modules/zod/**",
    "../lalgeo-mcp/dist/**",
    "../lalgeo-mcp/node_modules/**",
    "../lalgeo-mcp/package.json",
  ]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp/mcp"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/mcp/health"
  status = 200
