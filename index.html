<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>LalGeo | Open Mapping Infrastructure</title>
  <meta
    name="description"
    content="Open-source GIS for creating, analyzing and sharing maps — with your data, your storage, and your tools."
  >
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #050505;
      --muted: #5f6266;
      --content-width: 992px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--foreground);
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(calc(100% - 48px), var(--content-width));
      margin: 0 auto;
      padding: 101px 0 88px;
    }

    .eyebrow {
      margin: 0 0 38px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.22em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      max-width: 980px;
      margin: 0;
      font-size: clamp(68px, 8vw, 102px);
      font-weight: 700;
      letter-spacing: -0.07em;
      line-height: 0.96;
    }

    .intro {
      max-width: 760px;
      margin: 42px 0 0;
      color: #303235;
      font-size: 24px;
      line-height: 1.36;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 39px;
    }

    .button {
      display: inline-flex;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      padding: 13px 20px;
      border: 1px solid var(--foreground);
      color: var(--foreground);
      background: var(--background);
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      transition: background-color 140ms ease, color 140ms ease, transform 140ms ease;
    }

    .button-primary {
      color: #ffffff;
      background: var(--foreground);
    }

    .button:hover {
      color: #ffffff;
      background: var(--foreground);
      transform: translateY(-1px);
    }

    .button-primary:hover {
      color: var(--foreground);
      background: var(--background);
    }

    .button:focus-visible {
      outline: 3px solid #3178c6;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      main {
        width: min(calc(100% - 32px), var(--content-width));
        padding-top: 64px;
      }

      .eyebrow {
        margin-bottom: 28px;
        font-size: 12px;
      }

      h1 {
        font-size: clamp(52px, 15vw, 76px);
        letter-spacing: -0.065em;
      }

      .intro {
        margin-top: 34px;
        font-size: 20px;
      }
    }

    @media (max-width: 420px) {
      main {
        padding-top: 44px;
      }

      h1 {
        font-size: clamp(46px, 14.5vw, 62px);
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Open mapping infrastructure</p>
    <h1>Maps for humans<br>and agents.</h1>
    <p class="intro">
      Open-source GIS for creating, analyzing and sharing maps — with your data,
      your storage, and your tools.
    </p>
    <nav class="actions" aria-label="Get started">
      <a class="button button-primary" href="https://maps.lalgeo.com/maps">Open LalGeo&nbsp; →</a>
      <a class="button" href="https://github.com/namanadded/lalgeo-dot-com">View on GitHub</a>
    </nav>
  </main>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-NLY6QZ7L7B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-NLY6QZ7L7B");
  </script>
</body>
</html>
