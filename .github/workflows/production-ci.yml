      - name: Check GeoJSON coordinate and collection integrity
        working-directory: maps
        run: npm run test:geojson-integrity

      - name: Check local workspace persistence recovery
        working-directory: maps
        run: npm run test:workspace-persistence
      - name: Check one-pass LalGeo import normalization
        working-directory: maps
        run: npm run test:lal-import-normalization
      - name: Check low-memory project serialization
        working-directory: maps
        run: npm run test:lal-serialization
      - name: Benchmark scoped cloud catalog discovery
        working-directory: maps
        run: npm run benchmark:cloud-catalog
      - name: Benchmark bounded cloud upload recovery
        working-directory: maps
        run: npm run benchmark:cloud-recovery
      - name: Check Dropbox upload content verification
        working-directory: maps
        run: npm run test:dropbox-content-hash
      - name: Benchmark verified cloud downloads
