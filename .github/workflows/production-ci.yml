      - name: Check off-canvas panel accessibility
        working-directory: maps
        run: npm run test:off-canvas-panel-a11y

      - name: Check maps workflow UI
        working-directory: maps
        run: npm run test:workflow-ui

      - name: Check layer import journey
        working-directory: maps
        run: npm run test:layer-import-journey

      - name: Check layer actions journey
        working-directory: maps
        run: npm run test:layer-actions-journey

      - name: Check layer selection controls
        working-directory: maps
        run: npm run test:layer-selection-controls

      - name: Check new layer dialog journey
        working-directory: maps
        run: npm run test:new-layer-dialog-journey

      - name: Check table selection filter states
        working-directory: maps
